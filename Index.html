function creditarRendasPendentes(u){
if(!u||!u.planosAtivos||u.planosAtivos.length===0) return Promise.resolve(0);

var agora = Date.now();
var totalCreditado = 0;
var planosAtualizados = [];
var algumAlterado = false;

u.planosAtivos.forEach(function(p){
var ultimoCredito = p.ultimoCredito || p.dataInicio_timestamp || (agora - 24*60*60*1000);
var diff = agora - ultimoCredito;
var dias = Math.floor(diff / (24*60*60*1000));

if(dias > 0){
var ganho = p.diario * dias;
totalCreditado += ganho;
p.ganhoTotal = (p.ganhoTotal || 0) + ganho;
p.ultimoCredito = agora;
algumAlterado = true;
}
planosAtualizados.push(p);
});

if(!algumAlterado) return Promise.resolve(0);

var novoSaldo = u.saldo + totalCreditado;
var novoGanhosHoje = (u.ganhosHoje || 0) + totalCreditado;

return db.collection('usuarios').doc(u.uid).update({
saldo: novoSaldo,
ganhosHoje: novoGanhosHoje,
planosAtivos: planosAtualizados,
ultimoCreditoGlobal: agora
}).then(function(){
usuarioAtual.saldo = novoSaldo;
usuarioAtual.ganhosHoje = novoGanhosHoje;
usuarioAtual.planosAtivos = planosAtualizados;
return totalCreditado;
});
}

function admAprovarDep(docId){
var d=depositos.filter(function(x){return x.docId===docId;})[0];
if(!d||d.status!=='pendente')return;
var u=usuarios.filter(function(x){return x.uid===d.userId;})[0];
if(!u)return;
var novoSaldo=u.saldo+d.valor;
var novoTotal=(u.totalDepositado||0)+d.valor;
db.collection('usuarios').doc(d.userId).update({saldo:novoSaldo,totalDepositado:novoTotal}).then(function(){
return db.collection('depositos').doc(docId).update({status:'aprovado',dataAprovacao:new Date().toLocaleString('pt-BR')});
}).then(function(){
if(u.convidadoPor){
db.collection('usuarios').where('codigoConvite','==',u.convidadoPor).get().then(function(s){
if(s.size>0){
var patr=s.docs[0].data();
var bonus=d.valor*BONUS_PCT;
var novoBonus=(patr.totalBonus||0)+bonus;
var novoSaldoPatr=(patr.saldo||0)+bonus;
db.collection('usuarios').doc(s.docs[0].id).update({totalBonus:novoBonus,saldo:novoSaldoPatr});
}
}).catch(function(){});
}
alert('✅ Depósito aprovado!');
carregarTudo(function(){mudarTab('inicio');});
});
}

function investir(nome,valor,diario,prazo){
var u=usuarioAtual;
if(u.saldo<valor){alert('Saldo insuficiente.');return;}
var planos=u.planosAtivos||[];
if(planos.some(function(x){return x.nome===nome;})){alert('Você já tem este plano ativo.');return;}
if(!confirm('Confirmar investimento?\n\nPlano: '+nome+'\nValor: '+formatKz(valor)+'\nDiário: '+formatKz(diario)+'\nPrazo: '+prazo+' dias'))return;

var agora=Date.now();
planos.push({
nome:nome,
valor:valor,
diario:diario,
prazo:prazo,
dataInicio:new Date().toLocaleDateString('pt-BR'),
dataInicio_timestamp:agora,
ultimoCredito:agora,
ganhoTotal:0,
id:agora
});

var novoSaldo=u.saldo-valor;
db.collection('usuarios').doc(u.uid).update({saldo:novoSaldo,planosAtivos:planos}).then(function(){
usuarioAtual.saldo=novoSaldo;
usuarioAtual.planosAtivos=planos;
alert('✅ Plano '+nome+' ativado!');
carregarTudo(function(){mudarTab('inicio');});
});
}

var novoSaldo=u.saldo-valor;
var novoSacado=(u.totalSacado||0)+valor;

db.collection('usuarios').doc(u.uid).update({saldo:novoSaldo,totalSacado:novoSacado}).then(function(){
return db.collection('saques').add({
userId:u.uid,
userNome:u.nome,
userTelefone:u.telefone,
valor:valor,
taxa:taxa,
liquido:liquido,
metodo:metNome,
conta:conta,

status:'pendente',
timestamp:firebase.firestore.FieldValue.serverTimestamp()
});
}).then(function(){

carregarTudo(function(){mudarTab('inicio');});
});
}

function abrirAlterarSenha(){
var atual=prompt('Digite a senha atual (6 dígitos):');
if(!atual||atual.length!==6){alert('Senha inválida.');return;}
var nova=prompt('Digite a nova senha (6 dígitos):');
if(!nova||nova.length!==6){alert('Nova senha deve ter 6 dígitos.');return;}
var conf=prompt('Confirme a nova senha:');
if(nova!==conf){alert('As senhas não coincidem.');return;}

var user=auth.currentUser;
if(!user){alert('Sessão expirada.');return;}

var cred=firebase.auth.EmailAuthProvider.credential(user.email,atual);
user.reauthenticateWithCredential(cred).then(function(){
return user.updatePassword(nova);
}).then(function(){
alert('✅ Senha alterada com sucesso!');
}).catch(function(err){
var m='Erro ao alterar senha.';
if(err.code==='auth/wrong-password') m='Senha atual incorreta.';
alert(m);
});

function abrirConfigAdmin(){
var grupo=prompt('Link do Grupo WhatsApp:',WHATSAPP_GRUPO);
var sup1=prompt('Número Suporte 1 (WhatsApp):',SUPORTE_1);
var sup2=prompt('Número Suporte 2 (WhatsApp):',SUPORTE_2);
var taxa=prompt('Taxa de saque em %:',(TAXA_SAQUE*100).toString());
var minSaq=prompt('Valor mínimo de saque (Kz):',MIN_SAQUE.toString());
var minDep=prompt('Valor mínimo de depósito (Kz):',MIN_DEPOSITO.toString());
var iban=prompt('IBAN de depósito:',DADOS.iban);
var titular=prompt('Titular da conta:',DADOS.titular);
var paypayEnt=prompt('PayPay Entidade:',DADOS.paypayEntidade);
var paypayRef=prompt('PayPay Referência:',DADOS.paypayReferencia);
var unitelRef=prompt('Unitel Money Referência:',DADOS.unitelReferencia);

var dados={};
if(grupo) dados.whatsappGrupo=grupo;
if(sup1) dados.suporte1=sup1;
if(sup2) dados.suporte2=sup2;
if(taxa) dados.taxaSaque=parseFloat(taxa)/100;
if(minSaq) dados.minSaque=parseFloat(minSaq);
if(minDep) dados.minDeposito=parseFloat(minDep);
if(iban) dados.iban=iban;
if(titular) dados.titular=titular;
if(paypayEnt) dados.paypayEntidade=paypayEnt;
if(paypayRef) dados.paypayReferencia=paypayRef;
if(unitelRef) dados.unitelReferencia=unitelRef;
dados.atualizadoEm=new Date().toLocaleString('pt-BR');

db.collection('config').doc('global').set(dados,{merge:true}).then(function(){
/* Atualiza variáveis locais */
if(grupo) WHATSAPP_GRUPO=grupo;
if(sup1) SUPORTE_1=sup1;
if(sup2) SUPORTE_2=sup2;
if(taxa) TAXA_SAQUE=parseFloat(taxa)/100;
if(minSaq) MIN_SAQUE=parseFloat(minSaq);
if(minDep) MIN_DEPOSITO=parseFloat(minDep);
if(iban) DADOS.iban=iban;
if(titular) DADOS.titular=titular;
if(paypayEnt) DADOS.paypayEntidade=paypayEnt;
if(paypayRef) DADOS.paypayReferencia=paypayRef;
if(unitelRef) DADOS.unitelReferencia=unitelRef;
alert('✅ Configurações atualizadas!');
carregarTudo(function(){mudarTab('inicio');});
}).catch(function(){
alert('❌ Erro ao guardar. Tente novamente.');
});
}

/* ===== INICIALIZAÇÃO ===== */
auth.onAuthStateChanged(function(user){
if(user){
db.collection('usuarios').doc(user.uid).get().then(function(doc){
if(doc.exists){
var d=doc.data();
d.uid=doc.id;
if(d.bloqueado){
alert('Conta bloqueada. Contacte o suporte: '+SUPORTE_1);
auth.signOut();
return;
}
usuarioAtual=d;
abrirApp();
} else {
mostrarTela('telaAuth');
}
}).catch(function(err){
console.error(err);
mostrarTela('telaAuth');
});
} else {
mostrarTela('telaAuth');
try {
var p=new URLSearchParams(window.location.search);
var ref=p.get('ref');
if(ref){
setTimeout(function(){
var c=document.getElementById('r_code');
if(c) c.value=ref.toUpperCase();
},300);
}
} catch(e){}
}
});
